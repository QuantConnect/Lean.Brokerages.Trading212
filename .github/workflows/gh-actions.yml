name: Build & Test

on:
  push:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    container:
        image: quantconnect/lean:foundation
        options: --cpus 12 --memory 12g
        env:
          QC_TRADING212_BROKERAGE_KEY: ${{ secrets.QC_TRADING212_BROKERAGE_KEY }}
          QC_TRADING212_BROKERAGE_SECRET: ${{ secrets.QC_TRADING212_BROKERAGE_SECRET }}
          QC_JOB_USER_ID: ${{ secrets.QC_JOB_USER_ID }}
          QC_API_ACCESS_TOKEN: ${{ secrets.QC_API_ACCESS_TOKEN }}
          QC_JOB_ORGANIZATION_ID: ${{ secrets.QC_JOB_ORGANIZATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # The released Lean does not contain Trading212BrokerageModel yet, so the build is pinned to the
      # fork branch that adds it (QuantConnect/Lean#9982, stacked on #9983 and #9985).
      # TODO: switch this to `repository: QuantConnect/Lean`, `ref: master` once #9982 is merged.
      - name: Checkout Lean
        uses: actions/checkout@v2
        with:
          repository: nimakalantar/Lean
          ref: feature-9981-trading212-settlement-model
          path: Lean

      - name: Move Lean
        run: mv Lean ../Lean

      - name: Run build and tests
        run: |
          # Build
          dotnet build /p:Configuration=Release /v:quiet /p:WarningLevel=1 QuantConnect.Trading212Brokerage.sln && \
          # Run Tests
          dotnet test ./QuantConnect.Trading212Brokerage.Tests/bin/Release/QuantConnect.Brokerages.Trading212.Tests.dll

